<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dynamic Binary Image (from text)</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0;
      background: #000;
      overflow-x: hidden;   /* no horizontal scroll */
      overflow-y: auto;     /* vertical scroll */
      color: #ddd;
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .hint {
      position: sticky; top: 0; z-index: 20;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(6px);
      padding: 10px 12px; text-align: center;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .wrap {
      width: 100%;
      max-width: 100vw;
      margin: 0 auto;
      display: block;
    }
    .part {
      width: 100%;
      display: block;
      position: relative;
      background: #111;
    }
    .placeholder {
      padding: 20px 12px;
      text-align: center;
      color: #9aa;
      font-size: 13px;
    }
    canvas {
      width: 100%;     /* scale to page width */
      height: auto;    /* keep aspect ratio */
      display: block;
      image-rendering: pixelated;    /* crisp pixels when scaled */
      image-rendering: crisp-edges;  /* fallback */
    }
    .error {
      color: #f88;
    }
    .meta {
      position: absolute; right: 8px; top: 8px; z-index: 5;
      background: rgba(0,0,0,.5);
      color: #ccc; font-size: 12px; padding: 2px 6px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="hint">
    Loading from binary text files on scroll (0 = black, 1 = white).
    Width is <code>w</code> param (default 880). Example: <code>?w=3840</code>.
  </div>

  <main id="container" class="wrap"></main>

  <script>
    // --- Config ---
    const TOTAL_PARTS = 123;                    // number of text files/parts
    const PARAM_W = Number(new URLSearchParams(location.search).get('w'));
    const WIDTH = Number.isFinite(PARAM_W) && PARAM_W > 0 ? Math.floor(PARAM_W) : 880;
    const FILE_TEMPLATE = (i) => `binary_output_part_${i}.txt`;

    // Pre-create DOM slots for each part
    const container = document.getElementById('container');
    for (let i = 1; i <= TOTAL_PARTS; i++) {
      const section = document.createElement('section');
      section.className = 'part';
      section.id = `part-${i}`;
      section.dataset.part = String(i);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `Part ${i}/${TOTAL_PARTS}`;
      section.appendChild(meta);

      const placeholder = document.createElement('div');
      placeholder.className = 'placeholder';
      placeholder.textContent = `Loading part ${i}…`;
      section.appendChild(placeholder);

      container.appendChild(section);
    }

    // Lazy-load each part when it enters the viewport
    const inFlight = new Set();
    const loaded = new Set();

    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        const partEl = entry.target;
        const part = Number(partEl.dataset.part);
        if (loaded.has(part) || inFlight.has(part)) return;
        inFlight.add(part);
        loadAndRender(partEl, part)
          .catch((err) => showError(partEl, err))
          .finally(() => inFlight.delete(part));
      });
    }, {
      root: null,
      rootMargin: '800px 0px', // pre-load a bit ahead/behind
      threshold: 0.01
    });

    document.querySelectorAll('.part').forEach(el => io.observe(el));

    // Fetch the text, convert to pixels, and draw onto a canvas
    async function loadAndRender(partEl, part) {
      const url = FILE_TEMPLATE(part);
      const resp = await fetch(url, { cache: 'force-cache' });
      if (!resp.ok) throw new Error(`Fetch failed (${resp.status}) for ${url}`);
      const text = await resp.text();

      // Sanitize and convert to numeric bits (0/1). Ignore any non 0/1.
      // (Your files should already be only 0/1; this is extra safety.)
      const clean = text.replace(/[^01]/g, '');
      if (!clean.length) throw new Error(`No binary data found in ${url}`);

      // Compute height from the number of pixels and WIDTH
      const totalPixels = Math.floor(clean.length / 1); // one char per pixel
      const height = Math.floor(totalPixels / WIDTH);
      const usable = height * WIDTH; // drop any trailing partial row
      const slice = clean.slice(0, usable);

      // Create canvas and pixel buffer
      const canvas = document.createElement('canvas');
      canvas.width = WIDTH;
      canvas.height = height;

      // Draw using ImageData (RGBA)
      const ctx = canvas.getContext('2d', { willReadFrequently: false });
      const imageData = ctx.createImageData(WIDTH, height);
      const data = imageData.data; // Uint8ClampedArray (length = WIDTH * height * 4)

      // Fill pixels: 0 -> black, 1 -> white
      // Fast path: avoid parseInt per char by using charCodeAt and comparing to '1'
      for (let i = 0, p = 0; i < usable; i++, p += 4) {
        const bit = slice.charCodeAt(i) === 49 ? 255 : 0; // '1' => 49
        data[p] = bit;     // R
        data[p + 1] = bit; // G
        data[p + 2] = bit; // B
        data[p + 3] = 255; // A
      }

      ctx.putImageData(imageData, 0, 0);

      // Swap placeholder with the rendered canvas
      partEl.querySelector('.placeholder')?.remove();
      partEl.appendChild(canvas);

      loaded.add(part);
      // Free memory from large strings
      // (slice and text are dropped as function scope exits)
    }

    function showError(partEl, err) {
      const ph = partEl.querySelector('.placeholder');
      if (ph) {
        ph.classList.add('error');
        ph.textContent = `Error: ${err.message}`;
      } else {
        const div = document.createElement('div');
        div.className = 'placeholder error';
        div.textContent = `Error: ${err.message}`;
        partEl.appendChild(div);
      }
      console.error(err);
    }

    // Optional: keyboard jump between parts
    addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      const current = Math.max(1, Math.min(TOTAL_PARTS, Math.round(scrollY / innerHeight) + 1));
      const next = e.key === 'ArrowDown' ? Math.min(TOTAL_PARTS, current + 1) : Math.max(1, current - 1);
      document.getElementById(`part-${next}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  </script>
</body>
</html>
