<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Difference Engine 3.0 — Purgatory</title>

  <link rel="stylesheet" href="./assets/css/style.css" />

  <style>
    html, body { height: 100%; margin: 0; background:#000; color:#fff; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    #purgatory_stage { position: relative; min-height: 100vh; overflow:hidden; }
    #purgatory_canvas_container { position: relative; width: 100%; height: 100vh; }
    #purgatory_canvas_container canvas { display:block; width:100%; height:100%; }

    #purgatory_controls {
      position:absolute; left:0; top:0; right:0;
      display:flex; gap:8px; padding:10px;
      z-index:10;
      pointer-events:none;
    }
    #purgatory_controls > * { pointer-events:auto; }

    #purgatory_spinner {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      background: rgba(0,0,0,0.65);
      z-index:20;
    }
    .spinner_wheel {
      width:28px; height:28px; border-radius:50%;
      border:3px solid rgba(255,255,255,0.25);
      border-top-color: rgba(255,255,255,0.9);
      animation: spin 0.9s linear infinite;
      margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    console.log("purgatory.html parsed:", location.pathname);
    window.addEventListener("error", (e) => {
      console.error("GLOBAL ERROR:", e.message, e.filename, e.lineno, e.colno);
    });
    window.addEventListener("unhandledrejection", (e) => {
      console.error("UNHANDLED PROMISE:", e.reason);
    });
  </script>
</head>

<body>
  <div id="purgatory_stage">
    <div id="purgatory_canvas_container" aria-label="Purgatory scene">
      <div id="purgatory_spinner" aria-hidden="true">
        <div class="spinner_wheel"></div>
        <div style="font-size:13px; opacity:.9;">Loading Purgatory…</div>
      </div>
    </div>

    <div id="purgatory_controls">
      <button id="btn_reset" type="button">Reset View</button>
      <button id="btn_shuffle" type="button">Shuffle Avatars</button>
    </div>
  </div>

  <!-- Three.js (classic scripts, NOT ESM modules) -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- Data + scene code -->
  <script src="./js/archive-data.js"></script>
  <script src="./js/purgatory.js"></script>
</body>
</html>
