<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Difference Engine 3.0 — Archive (Three.js port)</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .archive-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
    .archive-card{ border:1px solid rgba(187,170,144,.35); padding:6px; background: rgba(0,0,0,.25); }
    .archive-card img{ width: 100%; height:auto; display:block; }
    .archive-topbar{ display:flex; gap:10px; align-items:center; margin: 10px 0 14px; }
    .archive-topbar input{ width: 240px; padding: 6px; }
    .small{ font-size:12px; opacity:.9; color:rgb(187,170,144); }
    .btn { background:#1a1a1a; color:rgb(187,170,144); border:1px solid rgba(187,170,144,.45); padding:6px 10px; border-radius:4px; cursor:pointer; }
    .btn:hover { border-color: rgba(187,170,144,.9); }
    /* Lightbox */
    dialog#lightbox{ border:1px solid rgba(187,170,144,.55); padding:10px; background:#000; }
    #lightbox img{ max-width: 90vw; max-height: 80vh; display:block; }
  </style>
</head>
<body class="avatar-archive">

<div class="container container-nav-left">
  <div class="page-image"></div>

  <nav id="main-nav" class="nav" aria-label="Main">
    <ul>
      <li class="nav-item"><a href="index.html"><img alt="Difference Engine 3" src="assets/img/mi-difference-engine-3.png"></a></li>
      <li class="nav-item"><a href="museum.html"><img alt="Avatar Museum" src="assets/img/mi-avatar-museum.png"></a></li>
      <li class="nav-item"><a href="purgatory.html"><img alt="Avatar Purgatory" src="assets/img/mi-avatar-purgatory.png"></a></li>
      <li class="nav-item"><a href="archive.html"><img alt="Avatar Archive" src="assets/img/mi-avatar-archive.png"></a></li>
      <li class="nav-item"><a href="history.html"><img alt="Installation History" src="assets/img/mi-installation-history.png"></a></li>
      <li class="nav-item"><a href="credits.html"><img alt="Credits" src="assets/img/mi-credits.png"></a></li>
    </ul>
  </nav>

  <main class="content">
    <hr>

    <div class="text-std">
      <p>
        The Archive is a snapshot wall. In the original system these images were produced from the museum experience; in this static port we simply display the bundled archive captures.
      </p>

      <div class="archive-topbar">
        <input id="archive_filter" type="text" placeholder="Filter (e.g. 42 or 000042)…" />
        <button id="btn_random" class="btn" type="button">Random</button>
        <span id="archive_count" class="small"></span>
      </div>

      <div id="archive_grid" class="archive-grid"></div>

      <dialog id="lightbox">
        <form method="dialog" style="text-align:right; margin:0 0 6px;">
          <button class="btn" value="close">Close</button>
        </form>
        <img id="lightbox_img" alt="Archive image" />
        <div id="lightbox_caption" class="small" style="margin-top:8px;"></div>
      </dialog>
    </div>
  </main>
</div>

<script src="js/archive-data.js"></script>
<script src="js/archive.js"></script>
</body>
</html>
