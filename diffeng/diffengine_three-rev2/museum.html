<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Difference Engine 3.0 — Museum (Three.js port)</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    #museum_canvas_container { position: relative; width: 600px; height: 400px; }
    #museum_ui_bar { display:flex; gap:8px; align-items:center; margin: 8px 0 12px; }
    .btn { background:#1a1a1a; color:rgb(187,170,144); border:1px solid rgba(187,170,144,.45); padding:6px 10px; border-radius:4px; cursor:pointer; }
    .btn:hover { border-color: rgba(187,170,144,.9); }
    .small { font-size: 12px; opacity: .9; }
    .hint { margin-top: 10px; }
    canvas { display:block; }
  </style>
</head>
<body class="avatar-museum">

<div class="container container-nav-left">
  <div class="page-image"></div>

  <nav id="main-nav" class="nav" aria-label="Main">
    <ul>
      <li class="nav-item"><a href="index.html"><img alt="Difference Engine 3" src="assets/img/mi-difference-engine-3.png"></a></li>
      <li class="nav-item"><a href="museum.html"><img alt="Avatar Museum" src="assets/img/mi-avatar-museum.png"></a></li>
      <li class="nav-item"><a href="purgatory.html"><img alt="Avatar Purgatory" src="assets/img/mi-avatar-purgatory.png"></a></li>
      <li class="nav-item"><a href="archive.html"><img alt="Avatar Archive" src="assets/img/mi-avatar-archive.png"></a></li>
      <li class="nav-item"><a href="history.html"><img alt="Installation History" src="assets/img/mi-installation-history.png"></a></li>
      <li class="nav-item"><a href="credits.html"><img alt="Credits" src="assets/img/mi-credits.png"></a></li>
    </ul>
  </nav>

  <main class="content">
    <hr>

    <div class="text-std">
      <div id="museum_app">
        <form id="avatar-input-form">
          <div id="avatar-input-form-controls" class="text-center">
            <span>Select AVATAR and Enter LOGIN name</span>
            <input name="loginName" id="museum-avatar-login-name" type="text" placeholder="Enter your LOGIN Name" maxlength="10" />
            <input type="submit" value="Log in" />
            <div id="museum_message" class="small" style="margin-top:10px;"></div>
          </div>

          <div id="avatar-input-form-avatars">
            <div class="avatar-input-form-avatars-item text-right">
              <input type="radio" name="avatarImage" value="avatar1" />
              <img id="avatar_camera_snapshot" alt="avatar1" src="assets/img/avatar1.jpg" />
              <br>
              <div id="tooltip-text">(Webcam capture in this port is optional — use the button after logging in.)</div>
            </div>
            <div class="avatar-input-form-avatars-item text-right"><input type="radio" name="avatarImage" value="avatar2" /><img alt="avatar2" src="assets/img/avatar2.jpg" /><br></div>
            <div class="avatar-input-form-avatars-item text-right"><input type="radio" name="avatarImage" value="avatar3" /><img alt="avatar3" src="assets/img/avatar3.jpg" /><br></div>
            <div class="avatar-input-form-avatars-item text-right"><input type="radio" name="avatarImage" value="avatar4" /><img alt="avatar4" src="assets/img/avatar4.jpg" /><br></div>
            <div class="avatar-input-form-avatars-item text-right"><input type="radio" name="avatarImage" value="avatar5" /><img alt="avatar5" src="assets/img/avatar5.jpg" /><br></div>
            <div class="avatar-input-form-avatars-item text-right"><input type="radio" name="avatarImage" value="avatar6" /><img alt="avatar6" src="assets/img/avatar6.jpg" /><br></div>
            <div class="avatar-input-form-avatars-item text-right"><input type="radio" name="avatarImage" value="avatar7" /><img alt="avatar7" src="assets/img/avatar7.jpg" /><br></div>
          </div>
        </form>

        <section id="museum_stage" hidden>
          <div id="museum_ui_bar">
            <button id="btn_reset" class="btn" type="button">Reset view</button>
            <button id="btn_toggle_labels" class="btn" type="button">Toggle labels</button>
            <button id="btn_webcam" class="btn" type="button">Use webcam as avatar…</button>
            <span id="museum_identity" class="small"></span>
          </div>

          <div id="museum_canvas_container">
            <div id="museum_spinner" class="spinner" aria-hidden="true"></div>
          </div>

          <p class="text-std hint">
            Drag to orbit · Scroll to zoom · Right-drag to pan. This is a simplified Three.js scene standing in for the original Blend4Web museum.
          </p>
        </section>
      </div>
    </div>
  </main>
</div>

<!-- Three.js (classic scripts, not ESM) to avoid CORS issues on static hosts -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="js/museum.js"></script>
</body>
</html>
